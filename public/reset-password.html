<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Reset password · postgame</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="reset-page">
    <div class="reset-card">
      <a href="/" class="reset-logo">post<span>game</span></a>
      <h1>Set a new password</h1>
      <div id="resetLoading"><p class="reset-info">Checking your reset link…</p></div>
      <div id="resetForm" style="display:none">
        <label class="acct-label">New password</label>
        <input type="password" id="newPassword" class="modal-input" placeholder="At least 6 characters">
        <label class="acct-label">Confirm new password</label>
        <input type="password" id="confirmPassword" class="modal-input">
        <button class="modal-btn" onclick="submitReset()" style="margin-top:8px">Update password</button>
        <div class="modal-error" id="resetMsg"></div>
      </div>
      <div id="resetInvalid" style="display:none">
        <p class="reset-info">This reset link is invalid or has expired. Please request a new one from the login screen.</p>
        <a href="/" class="modal-btn" style="display:block;text-align:center;text-decoration:none">Back to postgame</a>
      </div>
      <div id="resetDone" style="display:none">
        <p class="reset-success">Your password has been updated.</p>
        <a href="/" class="modal-btn" style="display:block;text-align:center;text-decoration:none">Back to postgame</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient = null;

    function parseHashParams() {
      var hash = window.location.hash.substring(1);
      var search = window.location.search.substring(1);
      var params = new URLSearchParams(hash || search);
      return params;
    }

    async function init() {
      // Load public Supabase config
      let cfg;
      try {
        const r = await fetch('/api/config');
        cfg = await r.json();
      } catch (e) {
        showInvalid(); return;
      }
      supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: { detectSessionInUrl: false, persistSession: false }
      });

      const params = parseHashParams();
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');
      const errCode = params.get('error_code');

      if (errCode) { showInvalid(); return; }

      if (accessToken && refreshToken) {
        // Implicit flow: set the session directly from the hash tokens
        try {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          });
          if (error) { console.warn(error); showInvalid(); return; }
          showForm();
          return;
        } catch (e) { console.warn(e); showInvalid(); return; }
      }

      // PKCE flow fallback: a ?code= param to exchange
      const code = params.get('code');
      if (code) {
        try {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (error) { showInvalid(); return; }
          showForm();
          return;
        } catch (e) { showInvalid(); return; }
      }

      showInvalid();
    }

    function showForm(){ hideAll(); document.getElementById('resetForm').style.display='block'; }
    function showInvalid(){ hideAll(); document.getElementById('resetInvalid').style.display='block'; }
    function showDone(){ hideAll(); document.getElementById('resetDone').style.display='block'; }
    function hideAll(){
      ['resetLoading','resetForm','resetInvalid','resetDone'].forEach(id=>{
        document.getElementById(id).style.display='none';
      });
    }

    async function submitReset(){
      const msg = document.getElementById('resetMsg');
      msg.textContent='';
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (pw.length < 6){ msg.textContent='Password must be at least 6 characters'; return; }
      if (pw !== confirm){ msg.textContent='Passwords do not match'; return; }
      try {
        const { error } = await supabaseClient.auth.updateUser({ password: pw });
        if (error) throw new Error(error.message);
        showDone();
      } catch(e){ msg.textContent = e.message; }
    }

    init();
  </script>
</body>
</html>
