<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Reset password · postgame</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="reset-page">
    <div class="reset-card">
      <a href="/" class="reset-logo">post<span>game</span></a>
      <h1>Set a new password</h1>
      <div id="resetForm">
        <label class="acct-label">New password</label>
        <input type="password" id="newPassword" class="modal-input" placeholder="At least 6 characters">
        <label class="acct-label">Confirm new password</label>
        <input type="password" id="confirmPassword" class="modal-input">
        <button class="modal-btn" onclick="submitReset()" style="margin-top:8px">Update password</button>
        <div class="modal-error" id="resetMsg"></div>
      </div>
      <div id="resetDone" style="display:none">
        <p class="reset-success">Your password has been updated.</p>
        <a href="/" class="modal-btn" style="display:block;text-align:center;text-decoration:none">Back to postgame</a>
      </div>
    </div>
  </div>

  <script>
    // Supabase delivers the recovery token in the URL hash (#access_token=...&type=recovery)
    let accessToken = null;
    (function parseHash(){
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      accessToken = params.get('access_token');
      const type = params.get('type');
      if (!accessToken || type !== 'recovery') {
        document.getElementById('resetMsg').textContent = 'This reset link is invalid or has expired. Please request a new one.';
      }
    })();

    async function submitReset(){
      const msg = document.getElementById('resetMsg');
      msg.textContent = ''; msg.style.color = '';
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (!accessToken) { msg.textContent = 'Invalid reset link. Request a new one from the login screen.'; return; }
      if (pw.length < 6) { msg.textContent = 'Password must be at least 6 characters'; return; }
      if (pw !== confirm) { msg.textContent = 'Passwords do not match'; return; }
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, newPassword: pw }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed');
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('resetDone').style.display = 'block';
      } catch (e) { msg.textContent = e.message; }
    }
  </script>
</body>
</html>
